version: 2
# `cooldown` holds a new release back for 7 days before a version update is
# proposed (security updates are not delayed). It is the quarantine that
# minimum-release-age in .npmrc asks for, which the pinned pnpm 9 ignores.
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - forwardemail/core
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    groups:
      production-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # E2E webview harness (Vitest + raw webdriverio, isolated lockfile)
  - package-ecosystem: npm
    directory: /e2e-webview
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    reviewers:
      - forwardemail/core
    labels:
      - dependencies
      - e2e
    groups:
      e2e-webview-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # E2E mobile harness (Vitest + raw webdriverio, isolated lockfile)
  - package-ecosystem: npm
    directory: /e2e-mobile
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    reviewers:
      - forwardemail/core
    labels:
      - dependencies
      - e2e
    groups:
      e2e-mobile-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Cloudflare Worker (Wrangler, which deploys with the Cloudflare token)
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    reviewers:
      - forwardemail/core
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - forwardemail/core
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'

  # Cargo (Tauri / Rust) dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - forwardemail/core
    labels:
      - rust
      - dependencies
    commit-message:
      prefix: 'deps(rust)'
    groups:
      cargo-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
