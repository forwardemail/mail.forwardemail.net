version: 2
# `cooldown` holds a new release back for 7 days before a version update is
# proposed (security updates are not delayed). It is the quarantine that
# minimum-release-age in .npmrc asks for, which the pinned pnpm 9 ignores.
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - forwardemail/core
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    groups:
      production-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Tauri's JS packages have to stay on the same major.minor as their Rust
      # crates, or `tauri build` stops with "Found version mismatched Tauri
      # packages". They are bumped by hand together with src-tauri/Cargo.toml.
      # Patch releases are fine and still come through.
      - dependency-name: '@tauri-apps/*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # E2E webview harness (Vitest + raw webdriverio, isolated lockfile)
  - package-ecosystem: npm
    directory: /e2e-webview
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    reviewers:
      - forwardemail/core
    labels:
      - dependencies
      - e2e
    groups:
      e2e-webview-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # setup/undici-dispatcher.ts installs an undici 6 Agent as the global
      # dispatcher so webdriverio 9 can open a session under Node 23+. It has
      # to stay on the major webdriverio itself uses.
      - dependency-name: undici
        update-types:
          - version-update:semver-major

  # E2E mobile harness (Vitest + raw webdriverio, isolated lockfile)
  - package-ecosystem: npm
    directory: /e2e-mobile
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    reviewers:
      - forwardemail/core
    labels:
      - dependencies
      - e2e
    groups:
      e2e-mobile-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # setup/undici-dispatcher.ts installs an undici 6 Agent as the global
      # dispatcher so webdriverio 9 can open a session under Node 23+. It has
      # to stay on the major webdriverio itself uses.
      - dependency-name: undici
        update-types:
          - version-update:semver-major

  # Cloudflare Worker (Wrangler, which deploys with the Cloudflare token)
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    reviewers:
      - forwardemail/core
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - forwardemail/core
    labels:
      - ci
      - dependencies
    commit-message:
      prefix: 'ci'
    groups:
      # Minor and patch only, so a major comes as its own pull request. The
      # release workflows depend on how tauri-action retries uploads
      # (tests/unit/release-gating.test.js), and a major there needs reading.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Cargo (Tauri / Rust) dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - forwardemail/core
    labels:
      - rust
      - dependencies
    commit-message:
      prefix: 'deps(rust)'
    groups:
      cargo-deps:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
