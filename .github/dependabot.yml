version: 2
# One pull request a week carries every minor and patch update: npm (the app,
# both e2e harnesses and the worker), GitHub Actions and Cargo together.
# Major versions are ignored everywhere and are upgraded by hand, since each
# one needs its changelog read. Security updates are separate from all of
# this and still arrive as their own pull requests.
#
# `cooldown` holds a new release back for 7 days before a version update is
# proposed (security updates are not delayed). It is the quarantine that
# minimum-release-age in .npmrc asks for, which the pinned pnpm 9 ignores.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns:
      - '*'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Tauri's JS packages have to stay on the same major.minor as their Rust
      # crates, or `tauri build` stops with "Found version mismatched Tauri
      # packages". They are bumped by hand together with src-tauri/Cargo.toml.
      # Patch releases are fine and still come through.
      - dependency-name: '@tauri-apps/*'
        update-types:
          - version-update:semver-minor

  # E2E webview harness (Vitest + raw webdriverio, isolated lockfile).
  # Its undici has to stay on the major webdriverio uses, because
  # setup/undici-dispatcher.ts installs it as the global dispatcher. The
  # ignore on majors covers that.
  - package-ecosystem: npm
    directory: /e2e-webview
    multi-ecosystem-group: dependencies
    patterns:
      - '*'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # E2E mobile harness (same setup and the same undici rule)
  - package-ecosystem: npm
    directory: /e2e-mobile
    multi-ecosystem-group: dependencies
    patterns:
      - '*'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # Cloudflare Worker (Wrangler, which deploys with the Cloudflare token)
  - package-ecosystem: npm
    directory: /worker
    multi-ecosystem-group: dependencies
    patterns:
      - '*'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # GitHub Actions. The release workflows depend on how tauri-action retries
  # uploads (tests/unit/release-gating.test.js), so a major there needs reading.
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns:
      - '*'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # Cargo (Tauri / Rust) dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    multi-ecosystem-group: dependencies
    patterns:
      - '*'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
