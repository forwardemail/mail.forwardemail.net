name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to no permissions; broaden only per-job
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  build-test:
    # Skip CI on release commits — release.yml handles builds and deploy.
    # `np` creates commits like "chore(release): 0.9.6" plus a matching tag,
    # and pushes both — the branch push would otherwise trigger a duplicate CI run.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check clear-manifest impact
        if: github.event_name == 'pull_request'
        id: clear_check
        continue-on-error: true
        run: node scripts/check-clear-manifest.js origin/${{ github.base_ref }}

      - name: Comment clear-manifest warning
        if: github.event_name == 'pull_request' && steps.clear_check.outputs.has_warning == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # The warning text is derived from the PR diff. Read it from the
          # environment instead of interpolating it into the script source,
          # where a backtick or ${} in the text would execute as JavaScript.
          CLEAR_WARNING: ${{ steps.clear_check.outputs.clear_warning }}
        with:
          script: |
            const body = process.env.CLEAR_WARNING;
            // Check for existing comment to avoid duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Clear-Site-Data Warning')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate || true

      - name: Lint
        run: pnpm lint

      - name: Verify generated README table of contents is committed
        run: git diff --exit-code -- README.md

      - name: Format
        run: pnpm format

      # Svelte check (typecheck) is intentionally NOT gated yet: `pnpm check`
      # currently reports ~2050 pre-existing errors (mostly missing .d.ts for
      # .js modules + implicit-any in workers). Enabling it as-is would turn CI
      # permanently red. Burning that backlog down to zero (or wiring a
      # baseline ratchet that only fails on NEW errors) is tracked separately;
      # do not simply uncomment this without doing that first.
      # - name: Svelte check
      #   run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Strip source maps
        run: find dist -name '*.map' -delete

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        run: pnpm test:e2e

  # The terminal client (forwardemail CLI): builds the bundle, runs its tests
  # (the end-to-end ones drive it in a pseudo-terminal) and makes sure the
  # standalone executable still builds and starts.
  # The terminal client on each system it ships for. The interactive tests
  # (a real pseudo-terminal) run on Linux; the command line, the TermDOM
  # integration, the updater, notifications and the standalone executable
  # are tested everywhere.
  cli:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    name: cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test the CLI
        run: pnpm test:cli

      - name: Build the standalone executable
        run: node scripts/build-sea.mjs --output "cli/dist/forwardemail${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Run the standalone executable
        env:
          FORWARDEMAIL_HOME: ${{ runner.temp }}/fe-home
          FORWARDEMAIL_NOTIFICATIONS: '1'
        run: |
          exe="cli/dist/forwardemail${{ runner.os == 'Windows' && '.exe' || '' }}"
          test "$("$exe" --version)" = "$(node -p 'require("./package.json").version')"
          "$exe" --help > /dev/null
          # Its notifier program is written out of the executable and found
          # (macOS and Windows; Linux uses the system's notify-send).
          "$exe" notifications | tee "$RUNNER_TEMP/notifications.txt"
          if [ "$RUNNER_OS" != Linux ]; then
            program="$(sed -n 's/^  program: //p' "$RUNNER_TEMP/notifications.txt")"
            node -e 'process.exit(require("fs").existsSync(process.argv[1]) ? 0 : 1)' "$program"
          fi

      # The same check release-cli.yml runs before attaching the installer to
      # a release, so a failure shows up here instead of in the release.
      - name: Check the installer
        if: runner.os != 'Windows'
        run: |
          sh -n cli/install.sh
          if command -v shellcheck >/dev/null; then shellcheck cli/install.sh; fi

      # The npm package as it would be published: packed, installed globally
      # into a scratch prefix and run from there.
      - name: Install the npm package
        run: |
          cd cli
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/npm" "$RUNNER_TEMP"/forwardemail-*.tgz
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/npm/forwardemail.cmd"; else bin="$RUNNER_TEMP/npm/bin/forwardemail"; fi
          test "$("$bin" --version | tr -d '\r')" = "$(node -p 'require("./package.json").version')"
          "$bin" --help > /dev/null
          FORWARDEMAIL_NOTIFICATIONS=1 "$bin" notifications

  # Pre-merge secret scan. Catches accidentally-committed tokens, signing
  # keys, etc. before they hit main. Scoped to repo content only; no signing
  # secrets needed. continue-on-error: false — fail the PR if anything is
  # found so it has to be remediated (rotated + history-rewritten) before
  # merge, not flagged-and-merged.
  #
  # Uses the gitleaks CLI directly instead of gitleaks-action, which requires
  # a paid GITLEAKS_LICENSE for organization-owned repositories.
  secret-scan:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          BASE="${{ github.event.before || github.event.pull_request.base.sha }}"
          NULL_SHA="0000000000000000000000000000000000000000"
          if [ -z "$BASE" ] || [ "$BASE" = "$NULL_SHA" ]; then
            # New branch, tag, or force-push — scan the full history
            gitleaks detect --source . --verbose
          else
            gitleaks detect --source . --verbose --log-opts="${BASE}..HEAD"
          fi
