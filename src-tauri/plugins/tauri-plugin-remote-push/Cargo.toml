[package]
name = "tauri-plugin-remote-push"
version = "1.0.10"
description = "Vendored fork of tauri-plugin-remote-push with corrected permission and token return shapes"
authors = ["Forward Email <support@forwardemail.net>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"
links = "tauri-plugin-remote-push"

[package.metadata.tauri-plugin]
android-src = "android"
ios-src = "ios"

[lib]
name = "tauri_plugin_remote_push"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", default-features = false }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
