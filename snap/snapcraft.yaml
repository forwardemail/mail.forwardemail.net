name: forwardemail-mail
base: core24
adopt-info: forwardemail-mail
summary: Private and secure email client
license: BUSL-1.1
contact: https://github.com/forwardemail/mail.forwardemail.net/issues
issues: https://github.com/forwardemail/mail.forwardemail.net/issues
source-code: https://github.com/forwardemail/mail.forwardemail.net
donation: https://forwardemail.net/donate
description: |
  Forward Email is a privacy-focused desktop email client for Forward Email
  accounts. It supports encrypted local storage, multiple accounts, search,
  folders, contacts, calendars, and native desktop notifications.

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  forwardemail-mail:
    command: usr/bin/forwardemail-desktop
    desktop: usr/share/applications/Forward Email.desktop
    plugs:
      - home
      - network
      - network-status

parts:
  forwardemail-mail:
    plugin: nil
    source: .
    override-pull: |
      set -eux
      craftctl default

      # The release workflow runs `pnpm install` and a full Tauri build in this
      # same checkout before the Snap step, so the copied source carries a host
      # node_modules and a multi-gigabyte Rust target dir. Neither is usable in
      # the isolated build and both eat runner disk.
      rm -rf "$CRAFT_PART_SRC/node_modules" \
             "$CRAFT_PART_SRC/dist" \
             "$CRAFT_PART_SRC/coverage" \
             "$CRAFT_PART_SRC/src-tauri/target"
    build-packages:
      - build-essential
      - ca-certificates
      - curl
      - file
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - patchelf
      - pkg-config
      - xz-utils
    stage-packages:
      - libayatana-appindicator3-1
      - librsvg2-2
      - libwebkit2gtk-4.1-0
      - xdg-utils
    override-build: |
      set -eux

      # Snapcraft's core24 build image does not guarantee the Rust, Node, or
      # pnpm versions this Tauri project needs. Install project-pinned
      # toolchains inside the build part; none are staged into the finished
      # snap.
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup"
      export CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      export PATH="$CARGO_HOME/bin:$PATH"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable

      # core24 apt ships Node 18, which is below the ">=20" engines floor in
      # package.json, and its nodejs package carries no corepack shim. Install
      # the same Node major the GitHub workflows pin and put it first on PATH.
      node_version=22.14.0
      case "$(uname -m)" in
        x86_64) node_arch=x64 ;;
        aarch64) node_arch=arm64 ;;
        *) echo "unsupported build architecture: $(uname -m)" >&2; exit 1 ;;
      esac
      node_home="$CRAFT_PART_BUILD/.node"
      node_tarball="$CRAFT_PART_BUILD/node.tar.xz"
      mkdir -p "$node_home"
      # Download to a file rather than piping into tar: this script may run
      # under dash, where a failed curl in a pipeline is masked and tar would
      # "succeed" on empty input.
      curl --proto '=https' --tlsv1.2 -fsSL -o "$node_tarball" \
        "https://nodejs.org/dist/v${node_version}/node-v${node_version}-linux-${node_arch}.tar.xz"
      tar -xJf "$node_tarball" -C "$node_home" --strip-components=1
      rm -f "$node_tarball"
      export PATH="$node_home/bin:$PATH"
      node --version

      # Non-interactive builds have no TTY to answer corepack's download prompt.
      export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      corepack enable
      corepack prepare pnpm@9.15.9 --activate
      pnpm install --frozen-lockfile
      pnpm tauri build --bundles deb

      deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f | head -n 1)
      test -n "$deb"
      dpkg-deb --extract "$deb" "$CRAFT_PART_INSTALL"

      # Keep the Snap package version exactly aligned with tauri.conf.json.
      craftctl set version="$(node -p "require('./src-tauri/tauri.conf.json').version")"

      # The desktop file comes from the Debian package. Under strict confinement
      # its executable must be the Snap application wrapper, not the raw binary.
      sed -i 's|^Exec=forwardemail-desktop|Exec=forwardemail-mail|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/Forward Email.desktop"
      sed -i 's|^Icon=forwardemail-desktop|Icon=forwardemail-desktop|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/Forward Email.desktop"
